version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-chatbot-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  chroma_data: